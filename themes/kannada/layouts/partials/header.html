<header class="site-header">
  <div class="container">
    <a href="{{ "" | relURL }}" class="site-logo">
      <span class="logo-ka">ಕ</span>
      <div class="logo-text">
        <span class="logo-title">{{ .Site.Title }}</span>
        <span class="logo-year">{{ .Site.Params.schoolYear }}</span>
      </div>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
        {{ if .HasChildren }}
        <div class="nav-item has-submenu">
          <a href="{{ .URL }}" class="nav-link {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}active{{ end }}">{{ .Name }}</a>
          <div class="submenu">
            {{ range .Children }}
            <a href="{{ .URL }}" class="submenu-link {{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
            {{ end }}
          </div>
        </div>
        {{ else }}
        <a href="{{ .URL }}" class="nav-link {{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>
<script>
  document.querySelector('.nav-toggle')?.addEventListener('click', () => {
    document.querySelector('.site-nav').classList.toggle('open');
  });
</script>
