<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nudi Kannada Shaale</title>
    <style>
:root {
  --bg: #f6f7f8;
  --ink: #1f2933;
  --muted: #f7efe3;
  --accent: #fff7ed;
  --hero-a: #1f2933;
  --hero-b: #31424f;
  --hero-c: #3b5362;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(120deg, rgba(255, 255, 255, 0.04) 15%, transparent 15%, transparent 45%, rgba(255, 255, 255, 0.03) 45%, rgba(255, 255, 255, 0.03) 60%, transparent 60%),
    linear-gradient(135deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c));
  color: var(--accent);
  display: grid;
  place-items: center;
}

.shell {
  width: min(860px, calc(100% - 48px));
  text-align: center;
  padding: 48px 0;
}

h1 {
  margin: 0 0 16px;
  font-size: clamp(2.2rem, 4vw, 4rem);
  line-height: 1.1;
}

p {
  margin: 0 auto;
  max-width: 720px;
  font-size: 1.15rem;
  line-height: 1.75;
  color: var(--muted);
}

.actions {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 36px;
}

.button {
  display: inline-block;
  min-width: 180px;
  padding: 14px 24px;
  border-radius: 999px;
  border: 1px solid rgba(255, 247, 237, 0.45);
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  font-size: 1.05rem;
}

.button-primary {
  background: var(--accent);
  color: var(--hero-a);
}
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Nudi Kannada Shaale</h1>
      <p>Nudi is an in-person Kannada learning community for children. We believe language grows best through real conversation, shared activities, classroom participation, and cultural connection.</p>
      <div class="actions">
        <a class="button button-primary" href="en/index.html">English</a>
        <a class="button" href="kn/index.html">ಕನ್ನಡ</a>
      </div>
    </main>
  </body>
</html>
